<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto WD XLM Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #b91c1c;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-start {
            background-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .btn-start:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-stop {
            background-color: var(--danger);
            color: #fff;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-stop:hover {
            background-color: var(--danger-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            background: #334155;
            margin-left: 10px;
        }

        .status-badge.running {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .terminal-container {
            background-color: #000;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .terminal-header span {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-family: monospace;
        }

        .terminal-body {
            height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            color: #a3be8c;
            line-height: 1.5;
            padding-right: 10px;
        }

        /* Custom Scrollbar for terminal */
        .terminal-body::-webkit-scrollbar {
            width: 8px;
        }
        .terminal-body::-webkit-scrollbar-track {
            background: #1e1e1e; 
            border-radius: 4px;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        .terminal-body::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .log-line {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-system {
            color: var(--accent);
        }

        .log-error {
            color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Auto WD XLM Bitget</h1>
            <p>Remote Control Dashboard via VPS</p>
        </div>

        <div class="controls">
            <button id="btnStart" class="btn-start" onclick="startBot()">
                ▶ Mulai Bot
            </button>
            <button id="btnStop" class="btn-stop" onclick="stopBot()" disabled>
                ■ Hentikan
            </button>
            <div style="display: flex; align-items: center;">
                Status: <span id="statusBadge" class="status-badge">Berhenti</span>
            </div>
        </div>

        <div class="terminal-container">
            <div class="terminal-header">
                <span>Terminal Log Output</span>
                <span id="connectionStatus" style="color: #10b981;">● Connected</span>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="log-line log-system">Menunggu instruksi...</div>
            </div>
        </div>
    </div>

    <script>
        const terminalBody = document.getElementById('terminalBody');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const statusBadge = document.getElementById('statusBadge');
        
        let eventSource = null;

        function appendLog(text, type = 'normal') {
            const div = document.createElement('div');
            div.className = 'log-line';
            if (type === 'system') div.classList.add('log-system');
            if (type === 'error') div.classList.add('log-error');
            div.textContent = text;
            terminalBody.appendChild(div);
            // Auto scroll to bottom
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        function updateUIState(isRunning) {
            if (isRunning) {
                btnStart.disabled = true;
                btnStop.disabled = false;
                statusBadge.textContent = "Berjalan";
                statusBadge.className = "status-badge running";
            } else {
                btnStart.disabled = false;
                btnStop.disabled = true;
                statusBadge.textContent = "Berhenti";
                statusBadge.className = "status-badge";
            }
        }

        function connectStream() {
            if (eventSource) {
                eventSource.close();
            }
            
            eventSource = new EventSource('/stream');
            
            eventSource.onmessage = function(event) {
                if(event.data.trim() !== '') {
                    appendLog(event.data);
                }
                
                if(event.data.includes('[SYSTEM] Bot telah selesai berjalan')) {
                    checkStatus();
                }
            };
            
            eventSource.onerror = function() {
                document.getElementById('connectionStatus').style.color = 'var(--danger)';
                document.getElementById('connectionStatus').textContent = '● Disconnected';
            };
            
            eventSource.onopen = function() {
                document.getElementById('connectionStatus').style.color = 'var(--success)';
                document.getElementById('connectionStatus').textContent = '● Connected';
            };
        }

        function checkStatus() {
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    updateUIState(data.running);
                });
        }

        function startBot() {
            fetch('/start', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        terminalBody.innerHTML = ''; // Clear terminal
                        appendLog('[SYSTEM] Memulai bot...', 'system');
                        checkStatus();
                    } else {
                        alert(data.message);
                    }
                });
        }

        function stopBot() {
            fetch('/stop', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    appendLog('[SYSTEM] Perintah stop dikirim.', 'error');
                    setTimeout(checkStatus, 1000);
                });
        }

        // Initialize
        checkStatus();
        connectStream();

    </script>
</body>
</html>
